ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odométrie des roues
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,   # ← orientation désactivée
                  false, false, false,
                  true,  true,  true,    # ← vitesses angulaires gardées
                  true,  true,  true]    # ← accélérations gardées
    imu0_differential: false
    imu0_relative: true                  # ← ajoute cette ligne
    imu0_remove_gravitational_acceleration: true